<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COREGOV Administração & Contabilidade</title>

<meta name="description" content="Gestão, contabilidade e estratégia para aumentar lucro e reduzir impostos de empresas em Presidente Prudente.">

<link rel="icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --verde:#00FF9F;
  --azul:#0B1220;
  --cinza:#CCCCCC;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins', sans-serif;
}

body {
  background:var(--azul);
  color:#fff;
  padding-top:90px;
}

/* HEADER */
header {
  position:fixed;
  top:0;
  width:100%;
  padding:12px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(11,18,32,0.85);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.logo-icon {
  height:34px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-name {
  color:var(--verde);
  font-weight:700;
}

.brand-sub {
  font-size:11px;
  color:var(--cinza);
}

nav a {
  margin:0 8px;
  color:var(--cinza);
  text-decoration:none;
}

nav a:hover {
  color:var(--verde);
}

.btn {
  background:var(--verde);
  color:#000;
  padding:9px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

/* HERO */
.hero {
  padding:80px 10%;
  text-align:center;
}

.hero h1 span {
  color:var(--verde);
}

/* 🔥 IMAGEM CENTRALIZADA */
.hero-img {
  display:block;
  margin:30px auto 0 auto;
  max-width:500px;
  width:100%;
  border-radius:12px;
}

/* CARDS */
.cards {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:40px 10%;
}

.card {
  background:#111A2E;
  padding:20px;
  border-radius:12px;
}

/* FOOTER */
footer {
  text-align:center;
  padding:30px;
  color:#888;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="/logo-icon.png" class="logo-icon">
    <div>
      <div class="brand-name">COREGOV</div>
      <div class="brand-sub">Administração & Contabilidade</div>
    </div>
  </div>

  <nav>
    <a href="/index.html">Início</a>
    <a href="/servicos.html">Serviços</a>
    <a href="/ferramentas.html">Ferramentas</a>
    <a href="/simulador.html">Simulador</a>
    <a href="/blog/index.html">Blog</a>
    <a href="/quem-somos.html">Quem Somos</a>
  </nav>

  <a class="btn" href="https://wa.me/5518991511523">Contato</a>
</header>

<section class="hero">
  <h1>Gestão inteligente para sua <span>empresa crescer</span></h1>
  <p>Contabilidade + estratégia para reduzir custos e aumentar lucro.</p>

  <!-- IMAGEM INSERIDA -->
  <img src="/coregov_clientes.png" alt="Clientes COREGOV" class="hero-img">

</section>

<section class="cards">
  <div class="card">📊 Gestão Financeira</div>
  <div class="card">📉 Redução de impostos</div>
  <div class="card">📈 Crescimento empresarial</div>
</section>

<footer>
  © 2026 COREGOV
</footer>

</body>
</html>
