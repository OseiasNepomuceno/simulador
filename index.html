<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Simulador de Transição Tributária</title>
<style>
body { font-family: Arial; background: #f5f6fa; padding: 20px; }
.container { max-width: 600px; margin: auto; }
input { width: 100%; padding: 10px; margin: 5px 0; }
button { padding: 12px; width: 100%; background: #2c7be5; color: white; border: none; cursor: pointer; }
.result { margin-top: 20px; padding: 15px; border-radius: 8px; }
.blue { background: #d6e4ff; }
.yellow { background: #fff3cd; }
.red { background: #f8d7da; }
.green { background: #d4edda; }
.whatsapp { background: #25d366; margin-top: 10px; }
</style>
</head>

<body>
<div class="container">
<h2>📊 Simulador de Transição Tributária</h2>

<label>Receita Mensal (R$)</label>
<input type="number" id="receita" value="150000">

<label>Alíquota Simples (%)</label>
<input type="number" id="simples" value="8">

<label>IBS (%)</label>
<input type="number" id="ibs" value="10">

<label>CBS (%)</label>
<input type="number" id="cbs" value="8.8">

<button onclick="calcular()">Calcular Impacto</button>

<div id="resultado"></div>
</div>

<script>
function calcular() {
    let receita = parseFloat(document.getElementById('receita').value);
    let simples = parseFloat(document.getElementById('simples').value);
    let ibs = parseFloat(document.getElementById('ibs').value);
    let cbs = parseFloat(document.getElementById('cbs').value);

    let atual = receita * (simples / 100);
    let novo = receita * ((ibs + cbs) / 100);
    let dif = novo - atual;
    let perc = (dif / atual) * 100;

    let cor = "green";
    let mensagem = "Cenário vantajoso";

    if (perc > 30) {
        cor = "red";
        mensagem = "Impacto alto! Planejamento urgente recomendado.";
    } else if (perc > 0) {
        cor = "yellow";
        mensagem = "Impacto moderado. Avalie estratégias.";
    }

    document.getElementById('resultado').innerHTML = `
        <div class="result blue">Imposto Atual: R$ ${atual.toFixed(2)}</div>
        <div class="result yellow">Novo Modelo: R$ ${novo.toFixed(2)}</div>
        <div class="result ${cor}">
            Diferença: R$ ${dif.toFixed(2)} (${perc.toFixed(2)}%)<br><br>
            <strong>${mensagem}</strong>
        </div>

        <div class="result">
            📌 Revisar precificação<br>
            📌 Analisar créditos tributários<br>
            📌 Avaliar regime tributário
        </div>

        <button class="whatsapp" onclick="whatsapp()">Falar com especialista</button>
    `;
}

function whatsapp() {
    let numero = "5518991888698";
    let texto = "Olá, fiz a simulação tributária e gostaria de uma análise completa.";
    window.open(`https://wa.me/${numero}?text=${encodeURIComponent(texto)}`, '_blank');
}
</script>

</body>
</html>
