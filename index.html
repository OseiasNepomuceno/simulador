<script>
document.addEventListener("DOMContentLoaded", () => {

  try {

    /* 🔥 POPUP AUTO-FECHA */
    setTimeout(() => {
      const popup = document.getElementById("popup");
      if (popup) popup.style.display = "none";
    }, 6000);

    /* 🔥 ANIMAÇÃO DAS SEÇÕES AO SCROLL */
    const sections = document.querySelectorAll('.section');

    const handleScroll = () => {
      sections.forEach(sec => {
        if (!sec) return;

        const top = sec.getBoundingClientRect().top;

        if (top < window.innerHeight - 100) {
          sec.classList.add('show');
        }
      });
    };

    window.addEventListener('scroll', handleScroll);
    handleScroll(); // executa uma vez ao carregar

    /* 🔥 HEADER DINÂMICO (SEM DUPLICAÇÃO E MAIS SEGURO) */
    const headerEl = document.querySelector("header");

    if (headerEl) {
      window.addEventListener("scroll", () => {
        headerEl.classList.toggle("scrolled", window.scrollY > 50);
      });
    }

  } catch (error) {
    console.error("Erro no script principal COREGOV:", error);
  }

});
</script>
