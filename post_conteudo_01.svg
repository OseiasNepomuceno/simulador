<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#c23152"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518"/>
      <stop offset="100%" style="stop-color:#d4a800"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Elementos decorativos -->
  <circle cx="950" cy="150" r="180" fill="#e94560" opacity="0.08"/>
  <circle cx="150" cy="950" r="250" fill="#f5c518" opacity="0.06"/>
  <circle cx="540" cy="540" r="400" fill="#e94560" opacity="0.03"/>

  <!-- Linhas decorativas -->
  <line x1="80" y1="180" x2="400" y2="180" stroke="#f5c518" stroke-width="4" opacity="0.5"/>
  <line x1="80" y1="188" x2="300" y2="188" stroke="#f5c518" stroke-width="2" opacity="0.3"/>

  <!-- Título Principal -->
  <text x="540" y="280" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">
    PLANEJAMENTO DE
  </text>
  <text x="540" y="345" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="1">
    CONTEÚDO 📱
  </text>

  <text x="540" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#f5c518" letter-spacing="4">
    PARA SUAS REDES SOCIAIS
  </text>

  <!-- Ícone/Emoji grande -->
  <text x="540" y="510" text-anchor="middle" font-size="80">🚀</text>

  <!-- Card Pacote 1 - 60 posts -->
  <rect x="90" y="560" width="880" height="140" rx="20" fill="url(#card1)" opacity="0.95"/>
  <rect x="90" y="560" width="880" height="140" rx="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <text x="170" y="618" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff">🔥 60 POSTS / MÊS</text>
  <text x="170" y="665" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.9">Criação de conteúdo completo</text>

  <text x="830" y="625" text-anchor="end" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">R$ 350</text>
  <text x="830" y="660" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0.8">/mês</text>

  <!-- Card Pacote 2 - 90 posts -->
  <rect x="90" y="730" width="880" height="140" rx="20" fill="url(#card2)" opacity="0.95"/>
  <rect x="90" y="730" width="880" height="140" rx="20" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>

  <text x="170" y="788" font-family="Arial Black, Arial, sans-serif" font-size="38" font-weight="900" fill="#1a1a2e">💎 90 POSTS / MÊS</text>
  <text x="170" y="835" font-family="Arial, sans-serif" font-size="22" fill="#1a1a2e" opacity="0.9">Pacote premium com prioridade</text>

  <text x="830" y="795" text-anchor="end" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="#1a1a2e">R$ 600</text>
  <text x="830" y="830" text-anchor="end" font-family="Arial, sans-serif" font-size="20" fill="#1a1a2e" opacity="0.8">/mês</text>

  <!-- CTA -->
  <rect x="200" y="910" width="680" height="65" rx="35" fill="#25D366"/>
  <rect x="200" y="910" width="680" height="65" rx="35" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>

  <text x="540" y="952" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">📲  (18) 9 9188-8698</text>

  <!-- Rodapé -->
  <text x="540" y="1015" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e94560" font-weight="bold" letter-spacing="2">
    ⚡ VAGAS LIMITADAS ⚡
  </text>

  <text x="540" y="1050" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#ffffff" opacity="0.4">
    Consulte condições · Sua presença digital começa aqui
  </text>
</svg>
