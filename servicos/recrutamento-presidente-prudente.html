<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Currículo</title>
</head>
<body>
  <h2>Cadastro de Currículo</h2>

  <form id="curriculoForm" action="javascript:void(0);">
    <input type="text" name="nome" placeholder="Nome completo" required><br>
    <input type="email" name="email" placeholder="E-mail" required><br>
    <input type="text" name="telefone" placeholder="Telefone / WhatsApp"><br>
    <select name="area">
      <option value="">Área de atuação</option>
      <option>Administrativo</option>
      <option>Financeiro</option>
      <option>Comercial</option>
      <option>Marketing</option>
      <option>Recursos Humanos</option>
      <option>Contabilidade</option>
    </select><br>
    <textarea name="experiencia" rows="4" placeholder="Experiência profissional"></textarea><br>
    <input type="file" name="curriculo" accept=".pdf,.doc,.docx"><br><br>
    <button type="submit">Enviar Currículo</button>
  </form>

  <!-- SDK Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const supabaseClient = supabase.createClient(
        'https://mztdxodzbwbgtwbelltc.supabase.co',   // substitua pela URL do seu projeto
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16dGR4b2R6YndiZ3R3YmVsbHRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTcxMjEsImV4cCI6MjA5MzMzMzEyMX0.gEBgtPsjRxipjBCB_dTt05hFGZ2xGh4lJhJH5TkUVNA'                     // substitua pela chave anon
      )

      const form = document.getElementById('curriculoForm')
      if (!form) {
        console.error('Formulário com id="curriculoForm" não encontrado!')
        return
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault()

        const nome = form.nome.value
        const email = form.email.value
        const telefone = form.telefone.value
        const area = form.area.value
        const experiencia = form.experiencia.value
        const file = form.curriculo.files[0]

        let filePath = null

        // Upload do arquivo para o bucket "curriculos"
        if (file) {
          // Normaliza o nome do arquivo
          const safeFileName = file.name
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // remove acentos
            .replace(/\s+/g, "_")                             // troca espaços por _
            .replace(/[^a-zA-Z0-9._-]/g, "");                 // remove caracteres inválidos

          const filePathKey = `uploads/${Date.now()}_${safeFileName}`;

          const { data: fileData, error: fileError } = await supabaseClient
            .storage
            .from('curriculos') // nome exato do bucket em minúsculo
            .upload(filePathKey, file)

          if (fileError) {
            console.error('Erro no upload:', fileError.message)
            alert('Erro ao enviar arquivo: ' + fileError.message)
            return
          } else {
            filePath = fileData.path
          }
        }

        // Inserção dos dados na tabela candidatos
        const { data, error } = await supabaseClient
          .from('candidatos')
          .insert([{ nome, email, telefone, area, experiencia, curriculo: filePath }])

        if (error) {
          console.error('Erro ao inserir:', error.message)
          alert('Erro ao salvar candidato: ' + error.message)
        } else {
          alert('Currículo enviado com sucesso!')
          form.reset()
        }
      })
    })
  </script>
</body>
</html>
