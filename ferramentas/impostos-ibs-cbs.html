<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Impostos IBS + CBS | COREGOV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --verde:#00FF9F;
  --azul:#0B1220;
  --azul2:#111A2A;
  --branco:#fff;
  --cinza:#ccc;
}

* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Poppins;
}

body {
  background:var(--azul);
  color:var(--branco);
  padding-top:90px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 10%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(11,18,32,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{height:45px;}

.brand-name{color:var(--verde); font-weight:700;}

nav a{
  margin:0 10px;
  color:var(--cinza);
  text-decoration:none;
}

nav a:hover{color:var(--verde);}

.btn{
  background:var(--verde);
  color:#000;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

/* CONTAINER */
.container{
  max-width:700px;
  margin:auto;
  padding:30px 20px;
}

.card{
  background:var(--azul2);
  padding:20px;
  border-radius:12px;
}

/* INPUT */
input, select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

/* BOTÃO */
button{
  width:100%;
  padding:14px;
  background:var(--verde);
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* RESULTADO */
.result{
  margin-top:15px;
  padding:15px;
  border-radius:10px;
}

.green{background:#1f6f3a;}
.yellow{background:#665c00;}
.red{background:#7a1f1f;}
.blue{background:#1d3557;}

.cta{
  margin-top:20px;
  text-align:center;
}
</style>
</head>

<body>

<header>
  <div class="brand">
    <img src="logo-icon.png" class="logo-icon">
    <div>
      <div class="brand-name">COREGOV</div>
      <small style="color:#ccc;">Impostos Inteligentes</small>
    </div>
  </div>

  <nav>
    <a href="index.html">Início</a>
    <a href="servicos.html">Serviços</a>
    <a href="simulador.html">Simulador</a>
  </nav>

  <a class="btn" href="https://wa.me/5518991511523">Contato</a>
</header>

<div class="container">

<h2>📊 Simulador de Impostos (IBS + CBS vs Simples)</h2>

<div class="card">

<label>Faturamento Mensal (R$)</label>
<input type="number" id="faturamento" value="150000">

<label>Simples Nacional (%)</label>
<input type="number" id="simples" value="8">

<label>IBS (%)</label>
<input type="number" id="ibs" value="10">

<label>CBS (%)</label>
<input type="number" id="cbs" value="8.8">

<button onclick="calcular()">Comparar Impostos</button>

<div id="resultado"></div>

</div>

<div class="cta">
  <h3>📌 Seu novo imposto pode aumentar ou reduzir sua margem em até 30%</h3>
  <br>
  <a class="btn" href="https://wa.me/5518991511523?text=Quero uma análise real da minha empresa">Quero uma análise real da minha empresa</a>
</div>

</div>

<script>
function calcular(){

  let fat = +document.getElementById("faturamento").value;
  let simples = +document.getElementById("simples").value;
  let ibs = +document.getElementById("ibs").value;
  let cbs = +document.getElementById("cbs").value;

  let atual = fat * (simples/100);
  let novo = fat * ((ibs+cbs)/100);

  let dif = novo - atual;
  let perc = (dif/atual)*100;

  let cor = "green";
  let msg = "Cenário saudável";

  if(perc > 30){
    cor="red";
    msg="⚠ Alto risco tributário — revisão urgente necessária";
  } else if(perc > 0){
    cor="yellow";
    msg="⚠ Aumento moderado — precisa de planejamento";
  }

  document.getElementById("resultado").innerHTML = `
    <div class="result blue">Simples Nacional: R$ ${atual.toFixed(2)}</div>
    <div class="result blue">IBS + CBS: R$ ${novo.toFixed(2)}</div>

    <div class="result ${cor}">
      Diferença: R$ ${dif.toFixed(2)} (${perc.toFixed(2)}%)<br><br>
      <b>${msg}</b>
    </div>

    <div class="result">
      📌 Impacto direto na margem de lucro<br>
      📌 Necessidade de reestruturação tributária<br>
      📌 Possível mudança de regime
    </div>
  `;
}
</script>

</body>
</html>
