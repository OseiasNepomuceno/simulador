<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador Tributário COREGOV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --verde: #00FF9F;
  --azul-escuro: #0B1220;
  --azul-medio: #111A2A;
  --branco: #FFFFFF;
  --cinza: #CCCCCC;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: var(--azul-escuro);
  color: var(--branco);
  padding-top: 90px;
}

header {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 10%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(11,18,32,0.6);
  backdrop-filter: blur(10px);
}

.brand {
  display: flex;
  gap: 10px;
}

.logo-icon {
  height: 50px;
}

.brand-name {
  color: var(--verde);
  font-weight: bold;
}

nav a {
  margin: 0 10px;
  color: var(--cinza);
  text-decoration: none;
}

.container {
  max-width: 650px;
  margin: auto;
  padding: 40px 20px;
}

.card {
  background: var(--azul-medio);
  padding: 20px;
  border-radius: 12px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 14px;
  background: var(--verde);
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
  cursor: pointer;
}

.result {
  margin-top: 15px;
  padding: 15px;
  border-radius: 10px;
}

.blue { background: #1d3557; }
.yellow { background: #665c00; }
.red { background: #7a1f1f; }
.green { background: #1f6f3a; }

.telegram-btn {
  background: #0088cc;
}
</style>
</head>

  
<body>

<header>
  <div class="brand">
    <img src="logo-icon.png" class="logo-icon">
    <div class="brand-name">COREGOV</div>
  </div>

  <nav>
  <a href="../index.html">Início</a>
  <a href="../servicos.html">Serviços</a>
  <a href="../simulador.html">Simulador</a>
</nav>
  
</header>

<div class="container">

<h2>🧠 Simulador Tributário Inteligente</h2>

<div class="card">

<!-- DADOS -->
<input type="text" id="nomeLead" placeholder="Seu nome">
<input type="text" id="telegram" placeholder="Telegram">

<input type="number" id="receita" placeholder="Faturamento mensal">
<input type="number" id="simples" value="8">
<input type="number" id="ibs" value="10">
<input type="number" id="cbs" value="8.8">

<button onclick="calcular()">Gerar Diagnóstico</button>

<div id="resultado"></div>

<!-- BLOQUEIO -->
<div id="bloqueio" style="display:none; margin-top:20px;">
  <div style="background: rgba(255,255,255,0.05); padding:20px; border-radius:12px; text-align:center;">
    
    <h3>🔒 Análise completa bloqueada</h3>

    <p style="color:#ccc;">
      Descubra exatamente quanto você pode ganhar ou perder.
    </p>

    <input type="email" id="email" placeholder="Seu melhor e-mail">

    <button onclick="liberar()">Liberar análise completa</button>

  </div>
</div>

<!-- RESULTADO COMPLETO -->
<div id="resultado-completo" style="display:none; margin-top:20px;"></div>

</div>
</div>

<script>
function calcular() {

let nome = document.getElementById("nomeLead").value;
let whats = document.getElementById("whats").value;

let receita = +document.getElementById('receita').value;
let simples = +document.getElementById('simples').value;
let ibs = +document.getElementById('ibs').value;
let cbs = +document.getElementById('cbs').value;

let atual = receita * (simples / 100);
let novo = receita * ((ibs + cbs) / 100);

let dif = novo - atual;
let perc = (dif / atual) * 100;

let cor = "green";
let msg = "Situação saudável";

if (perc > 30) {
  cor = "red";
  msg = "⚠️ Alto impacto tributário";
} else if (perc > 0) {
  cor = "yellow";
  msg = "⚠️ Atenção necessária";
}

document.getElementById("resultado").innerHTML = `
  <div class="result blue">Atual: R$ ${atual.toFixed(2)}</div>
  <div class="result yellow">Novo: R$ ${novo.toFixed(2)}</div>
  <div class="result ${cor}">
    Diferença: ${perc.toFixed(2)}%<br><br>
    <strong>${msg}</strong>
  </div>

  <div class="result">
    💡 Seu novo imposto pode impactar sua margem em até <strong>${perc.toFixed(2)}%</strong>
  </div>
`;

document.getElementById("bloqueio").style.display = "block";
}

function liberar() {

let email = document.getElementById("email").value;
if(!email){
  alert("Digite seu e-mail");
  return;
}

document.getElementById("bloqueio").style.display = "none";

let nome = document.getElementById("nomeLead").value;
let whats = document.getElementById("whats").value;

let texto = `Olá, me chamo ${nome}. Fiz o diagnóstico tributário e quero análise completa.`;

document.getElementById("resultado-completo").style.display = "block";
document.getElementById("resultado-completo").innerHTML = `
  <div class="result green">
    ✔ Melhor regime sugerido<br>
    ✔ Ajuste de precificação<br>
    ✔ Estratégia de economia tributária
  </div>

  <button class="telegram-btn" onclick="window.open('https://t.me/coregovbr?text='+encodeURIComponent(texto),'_blank')">
    Falar com especialista
  </button>
`;
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../supabase.js"></script>
<script src="../login.js"></script>
  
</body>
</html>
