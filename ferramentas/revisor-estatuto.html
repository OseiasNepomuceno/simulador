<div class="container">

<h2>📜 Revisor de Estatuto PRO</h2>
<p style="color:#ccc;">Análise jurídica automatizada com inteligência estratégica</p>

<div class="card">

<input type="text" id="nome" placeholder="Seu nome">
<input type="file" id="arquivo" accept=".pdf">

<button class="btn" onclick="analisarPDF()">🚀 Analisar Estatuto</button>

<div id="resultado"></div>

</div>

</div>

<script>

async function analisarPDF(){

let nome = document.getElementById("nome").value;
let file = document.getElementById("arquivo").files[0];

if(!nome || !file){
  alert("Preencha os campos");
  return;
}

document.getElementById("resultado").innerHTML = "⏳ Lendo documento...";

const reader = new FileReader();

reader.onload = async function(){

  const typedarray = new Uint8Array(this.result);
  const pdf = await pdfjsLib.getDocument(typedarray).promise;

  let textoCompleto = "";

  for(let i = 1; i <= pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const strings = content.items.map(item => item.str);
    textoCompleto += strings.join(" ") + " ";
  }

  gerarAnalise(nome, textoCompleto);
};

reader.readAsArrayBuffer(file);
}

/* 🧠 ANÁLISE INTELIGENTE */
function gerarAnalise(nome, texto){

let riscos = [];
let alertas = [];
let pontos_ok = [];

/* REGRAS SIMULADAS (base jurídica real) */

if(!texto.includes("ADMINISTRADOR")){
  riscos.push("Ausência de cláusula clara de administração");
}

if(!texto.includes("CAPITAL SOCIAL")){
  alertas.push("Capital social não identificado claramente");
}

if(texto.includes("LUCRO")){
  pontos_ok.push("Cláusula de distribuição de lucro encontrada");
}

if(!texto.includes("RESPONSABILIDADE")){
  riscos.push("Falta de definição de responsabilidade dos sócios");
}

/* RESULTADO */
let html = `
<div class="result">

<h3>📊 Diagnóstico Estratégico</h3><br>

<strong class="danger">⚠ Riscos encontrados:</strong><br>
${riscos.length ? riscos.map(r => "• " + r).join("<br>") : "Nenhum risco crítico identificado"}<br><br>

<strong class="alert">⚠ Pontos de atenção:</strong><br>
${alertas.length ? alertas.map(a => "• " + a).join("<br>") : "Nenhum alerta relevante"}<br><br>

<strong class="ok">✔ Pontos positivos:</strong><br>
${pontos_ok.length ? pontos_ok.map(p => "• " + p).join("<br>") : "Nenhum ponto identificado"}<br><br>

<hr><br>

<strong>📌 Recomendação:</strong><br>
Revisar cláusulas jurídicas para evitar riscos fiscais e societários.

</div>

<button class="btn" onclick="whats('${nome}')">
  Falar com especialista
</button>
`;

document.getElementById("resultado").innerHTML = html;
}

function whats(nome){
let msg = encodeURIComponent(`Olá, me chamo ${nome}. Usei o Revisor PRO e quero uma análise completa do meu estatuto.`);
window.open(`https://wa.me/5518991511523?text=${msg}`, "_blank");
}

</script>
