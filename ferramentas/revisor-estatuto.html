<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Revisor de Estatuto PRO | COREGOV</title>

    <link rel="icon" href="../favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-principal: #0b0f19;
            --bg-card: #131c2e;
            --cor-primaria: #22c55e; /* Verde Sucesso */
            --cor-secundaria: #2563eb; /* Azul Conexão */
            --texto-principal: #f8fafc;
            --texto-mutado: #94a3b8;
            --borda-suave: rgba(255, 255, 255, 0.05);
            
            /* Cores de Alerta do Diagnóstico */
            --danger: #ef4444;
            --alert: #f59e0b;
            --ok: #22c55e;

            /* COREGOV */
            --azul: #0f3460;
            --vermelho: #e94560;
            --dourado: #f5c518;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-principal);
            color: var(--texto-principal);
            padding-top: 120px;
            line-height: 1.6;
            min-height: 100vh;
            background: var(--bg-principal);
        }

        /* HEADER / NAV */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--borda-suave);
            z-index: 1000;
        }

        .logo-icon {
            height: 40px;
        }

        nav a {
            margin: 0 15px;
            color: var(--texto-mutado);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--cor-primaria);
        }

        /* CONTAINER GLOBAL */
        .container {
            max-width: 750px;
            margin: auto;
            padding: 40px 24px;
            text-align: center;
        }

        .container h2 {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 12px;
            color: #ffffff;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #cbd5e1;
            font-size: 16px;
            margin-bottom: 36px;
            font-weight: 400;
        }

        /* CARD DE OPERAÇÃO */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--borda-suave);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: left;
        }

        /* INPUTS */
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(11, 15, 25, 0.5);
            color: var(--texto-principal);
            font-size: 15px;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--cor-secundaria);
            background: rgba(11, 15, 25, 0.8);
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(11, 15, 25, 0.3);
            color: var(--texto-mutado);
            font-size: 14px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        input[type="file"]::-webkit-file-upload-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            color: var(--texto-principal);
            margin-right: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        input[type="file"]::-webkit-file-upload-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* BOTÕES */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--cor-primaria);
            color: #052e16;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(34, 197, 94, 0.3);
        }

        .btn-telegram {
            background-color: #128c7e;
            color: white;
            box-shadow: 0 4px 20px rgba(18, 140, 126, 0.2);
            margin-top: 16px;
        }

        .btn-telegram:hover {
            background-color: #075e54;
            box-shadow: 0 6px 24px rgba(18, 140, 126, 0.3);
        }

        /* RESULTADO / DIAGNÓSTICO */
        .status-loading {
            text-align: center;
            padding: 20px;
            color: var(--texto-mutado);
            font-weight: 600;
        }

        .result {
            margin-top: 32px;
            padding: 32px;
            border-radius: 12px;
            background: linear-gradient(180deg, #131c2e 0%, #0f172a 100%);
            border: 1px solid var(--borda-suave);
        }

        .result h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--borda-suave);
            padding-bottom: 12px;
            color: var(--texto-principal);
        }

        .item-group {
            margin-bottom: 20px;
        }

        .item-title {
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .item-list {
            list-style: none;
            padding-left: 4px;
            color: #cbd5e1;
            font-size: 14px;
        }

        .item-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }

        .danger { color: var(--danger); }
        .alert { color: var(--alert); }
        .ok { color: var(--ok); }

        .recommendation {
            background: rgba(37, 99, 235, 0.05);
            border-left: 3px solid var(--cor-secundaria);
            padding: 16px;
            border-radius: 0 8px 8px 0;
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 24px;
        }

        .recommendation strong {
            color: var(--texto-principal);
            display: block;
            margin-bottom: 4px;
        }

        /* 🦞 SEÇÃO DE OPORTUNIDADES DE CAPTAÇÃO */
        .oportunidades {
            background: rgba(245, 197, 24, 0.05);
            border: 2px solid var(--dourado);
            border-radius: 12px;
            padding: 24px;
            margin: 28px 0;
            text-align: left;
        }
        .oportunidades h3 {
            color: var(--dourado);
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 12px;
            border: none;
            padding: 0;
        }
        .oportunidades .stats-row {
            display: flex;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .oportunidades .stat-box {
            background: rgba(15, 52, 96, 0.4);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }
        .oportunidades .stat-box .big {
            font-size: 24px;
            font-weight: 800;
            color: var(--dourado);
        }
        .oportunidades .stat-box .big.red {
            color: var(--vermelho);
        }
        .oportunidades .stat-box .label {
            font-size: 11px;
            color: var(--texto-mutado);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .oportunidades .alerta {
            background: var(--vermelho);
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
        }
        .oportunidades table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 13px;
        }
        .oportunidades th {
            background: rgba(15, 52, 96, 0.8);
            color: white;
            padding: 8px 12px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .oportunidades td {
            padding: 8px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: var(--texto-mutado);
        }
        .oportunidades .valor-cell {
            color: var(--cor-primaria);
            font-weight: 700;
            white-space: nowrap;
        }
        .oportunidades .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 700;
        }
        .oportunidades .badge-red { background: rgba(233,69,96,0.2); color: #ef4444; }
        .oportunidades .badge-yellow { background: rgba(245,197,24,0.2); color: var(--dourado); }
        .oportunidades .badge-green { background: rgba(34,197,94,0.2); color: var(--cor-primaria); }
        .oportunidades .btn-editais {
            display: block;
            background: var(--vermelho);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            transition: background 0.2s;
        }
        .oportunidades .btn-editais:hover {
            background: #c73a52;
        }
        .oportunidades .footer-editais {
            font-size: 11px;
            color: var(--texto-mutado);
            font-style: italic;
            margin-top: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <img src="../logo-icon.png" class="logo-icon" alt="CoreGov">
    <nav>
        <a href="../index.html">Início</a>
        <a href="../servicos.html">Serviços</a>
        <a href="../editais/">Editais</a>
        <a href="../simulador.html">Simulador</a>
    </nav>
</header>

<div class="container">

    <h2>📜 Revisor de Estatuto PRO</h2>
    <p class="subtitle">Análise jurídica automatizada de conformidade legislativa para OSCs e ONGs</p>

    <div class="card">
        <label class="form-label" for="nome">Nome do Solicitante</label>
        <input type="text" id="nome" placeholder="Digite seu nome completo">

        <label class="form-label" for="arquivo">Estatuto Social da Organização (PDF)</label>
        <input type="file" id="arquivo" accept=".pdf">

        <button class="btn" onclick="analisarPDF()">🚀 Analisar Estatuto</button>

        <div id="resultado"></div>
    </div>

</div>

<script>
// ═══════════════════════════════════════════════════
// 🦞 DADOS DE EDITAIS (carregados automaticamente)
// ═══════════════════════════════════════════════════
let DADOS_EDITAIS = null;

async function carregarEditais() {
    try {
        const resp = await fetch('../editais/dados_editais.json?_=' + Date.now());
        DADOS_EDITAIS = await resp.json();
        console.log(`📋 ${DADOS_EDITAIS.resumo_estrategico.editais_abertos} editais carregados`);
    } catch (e) {
        console.log('ℹ️ Banco de editais não disponível');
    }
}
carregarEditais();

async function analisarPDF(){
    let nome = document.getElementById("nome").value;
    let file = document.getElementById("arquivo").files[0];

    if(!nome || !file){
        alert("Por favor, preencha o seu nome e selecione o arquivo PDF do estatuto.");
        return;
    }

    document.getElementById("resultado").innerHTML = "<div class='status-loading'>⏳ Analisando integridade do documento contra portarias federais...</div>";

    const reader = new FileReader();

    reader.onload = async function(){
        try {
            const typedarray = new Uint8Array(this.result);
            const pdf = await pdfjsLib.getDocument(typedarray).promise;

            let textoCompleto = "";

            for(let i = 1; i <= pdf.numPages; i++){
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                textoCompleto += strings.join(" ") + " ";
            }

            gerarAnalise(nome, textoCompleto.toUpperCase());
        } catch (error) {
            document.getElementById("resultado").innerHTML = "<div class='status-loading danger'>❌ Erro ao decodificar o arquivo PDF. Carregue um documento digital legível.</div>";
        }
    };

    reader.readAsArrayBuffer(file);
}

/* 🧠 ANÁLISE INTELIGENTE DE COMPLIANCE TRANSFEREGOV */
function gerarAnalise(nome, texto){
    let riscos = [];
    let alertas = [];
    let pontos_ok = [];

    // 1. Verificação de Distribuição de Lucros / Destinação do Patrimônio Residual (Portaria 424/2016 e MROSC)
    if (!texto.includes("LUCRO") && !texto.includes("SUPERÁVIT") && !texto.includes("REVERSÃO DE PATRIMÔNIO") && !texto.includes("PATRIMÔNIO RESIDUAL")) {
        riscos.push("Ausência de cláusula explícita de não-distribuição de lucros econômicos, dividendos ou bonificações patrimoniais.");
    } else if (!texto.includes("DISSOLUÇÃO") || !texto.includes("EXTINÇÃO")) {
        alertas.push("Cláusula de encerramento da entidade carece de detalhamento técnico sobre a reversão de patrimônio para fins públicos.");
    } else {
        pontos_ok.push("Regulamentação de destinação e uso de superávits institucionais identificada.");
    }

    // 2. Verificação de Conselho Fiscal (Exigência estrutural para movimentação e prestação de contas)
    if (!texto.includes("CONSELHO FISCAL") && !texto.includes("ÓRGÃO DE FISCALIZAÇÃO")) {
        riscos.push("Inexistência ou omissão de Conselho Fiscal devidamente estruturado (Obrigatório para governança exigida na Portaria 424/2016).");
    } else {
        pontos_ok.push("Estrutura interna de fiscalização de contas e controle orçamentário localizada.");
    }

    // 3. Verificação de Vedação a Parentesco / Nepotismo (Diretrizes de Integridade 2021 a 2026)
    if (!texto.includes("PARENTESCO") && !texto.includes("CONJUGE") && !texto.includes("NEPOTISMO") && !texto.includes("CÔNJUGE")) {
        riscos.push("O documento não prevê cláusula de barreira contra contratação ou vantagens a parentes de dirigentes com verbas da União (Desconformidade com normativas recentes do TransfereGov).");
    } else {
        pontos_ok.push("Critérios restritivos contra conflitos de interesse e nepotismo institucional mapeados.");
    }

    // 4. Verificação de Mecanismos de Transparência Ativa (Atualizações Regulatórias 2025/2026)
    if (!texto.includes("TRANSPARÊNCIA") && !texto.includes("SÍTIO ELETRÔNICO") && !texto.includes("INTERNET")) {
        alertas.push("Ausência de adequação às obrigações de transparência digital ativa para o recebimento de emendas parlamentares federais.");
    } else {
        pontos_ok.push("Referência ao princípio da publicidade e transparência corporativa localizada.");
    }

    /* 🦞 GERAR SEÇÃO DE OPORTUNIDADES COM EDITAIS */
    let htmlOportunidades = '';
    if (DADOS_EDITAIS) {
        const r = DADOS_EDITAIS.resumo_estrategico;
        const editais = DADOS_EDITAIS.editais;

        // Top 5 mais urgentes (com prazo mais curto)
        const comPrazo = editais.filter(e => e.dias_restantes !== null && e.prazo !== 'Aberto');
        comPrazo.sort((a, b) => (a.dias_restantes || 999) - (b.dias_restantes || 999));
        const top5 = comPrazo.slice(0, 5);

        let linhasTabela = '';
        for (const e of top5) {
            const dias = e.dias_restantes;
            let badgeClass = 'badge-green';
            let badgeText = '';
            if (dias <= 15) { badgeClass = 'badge-red'; badgeText = '🔴 ' + dias + ' dias'; }
            else if (dias <= 36) { badgeClass = 'badge-yellow'; badgeText = '🟡 ' + dias + ' dias'; }
            else { badgeClass = 'badge-green'; badgeText = '🟢 ' + dias + ' dias'; }

            linhasTabela += `<tr>
                <td>${e.titulo}</td>
                <td class="valor-cell">${e.valor_str}</td>
                <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            </tr>`;
        }

        htmlOportunidades = `
        <div class="oportunidades">
            <h3>🔥 Oportunidades de Captação Disponível</h3>
            <div class="stats-row">
                <div class="stat-box">
                    <div class="big red">${r.editais_abertos}</div>
                    <div class="label">Editais Abertos</div>
                </div>
                <div class="stat-box">
                    <div class="big">${r.soma_valores_humano}</div>
                    <div class="label">Em Recursos Disponíveis</div>
                </div>
                <div class="stat-box">
                    <div class="big red">${r.editais_para_ong}</div>
                    <div class="label">Para ONGs/OSCs</div>
                </div>
            </div>
            <div class="alerta">
                ⚠️ Com o estatuto social inadequado, sua organização NÃO pode acessar esses recursos!
            </div>
            <p style="font-size:14px;color:var(--texto-mutado);margin-bottom:8px;">
                ⚠️ <strong style="color:var(--dourado);">Prévia das oportunidades.</strong> Os valores e prazos acima são indicativos. 
                Os detalhes completos de cada edital e a orientação personalizada são fornecidos 
                <strong style="color:white;">exclusivamente aos clientes</strong> que contratam a adequação do estatuto.
            </p>
            <p style="font-size:14px;color:var(--texto-mutado);margin-bottom:12px;">
                Após fechar o contrato, nossa equipe encaminha sua organização para os editais certos 
                e define <strong style="color:var(--cor-primaria);">exatamente quanto submeter</strong> em cada projeto. 🎯
            </p>
            <table>
                <thead>
                    <tr>
                        <th>Edital</th>
                        <th>Valor</th>
                        <th>Prazo</th>
                    </tr>
                </thead>
                <tbody>
                    ${linhasTabela}
                </tbody>
            </table>
            <a href="../editais/" class="btn-editais">
                📋 Ver lista completa de ${r.editais_abertos} editais →
            </a>
            <div class="footer-editais">
                Dados atualizados automaticamente. Fontes: capitaai.com.br, editalong.com, capta.org.br
            </div>
        </div>`;
    }

    /* CONSTRUÇÃO DO DIAGNÓSTICO COM ESTRATÉGIA DE RETENÇÃO COMERCIAL */
    let html = `
    <div class="result">
        <h3>📊 Diagnóstico de Elegibilidade - TransfereGov</h3>
        
        <p style="font-size: 13.5px; color: var(--texto-mutado); margin-bottom: 20px;">
            Este diagnóstico processou a estrutura jurídica do documento confrontando-o com as exigências de habilitação da <strong>Portaria Interministerial nº 424/2016</strong>, emendas de conformidade de <strong>2021</strong>, decretos federais de integridade e as novas exigências de transparência pública consolidadas para <strong>2025/2026</strong>.
        </p>

        <div class="item-group">
            <span class="item-title danger">❌ Inadequações Críticas (Bloqueiam Captação):</span>
            <ul class="item-list">
                ${riscos.length ? riscos.map(r => "<li>⚠️ " + r + "</li>").join("") : "<li>✔️ Nenhuma desconformidade impeditiva primária foi identificada de forma automatizada.</li>"}
            </ul>
        </div>

        <div class="item-group">
            <span class="item-title alert">⚠️ Falhas de Ajuste Técnico (Risco de Rejeição de Propostas):</span>
            <ul class="item-list">
                ${alertas.length ? alertas.map(a => "<li>⚠️ " + a + "</li>").join("") : "<li>✔️ O documento está alinhado com as normativas acessórias mapeadas.</li>"}
            </ul>
        </div>

        <div class="item-group">
            <span class="item-title ok">✔️ Requisitos Identificados no Estatuto:</span>
            <ul class="item-list">
                ${pontos_ok.length ? pontos_ok.map(p => "<li>✔️ " + p + "</li>").join("") : "<li>⚠️ Estrutura de redação padrão com termos genéricos.</li>"}
            </ul>
        </div>

        <div class="recommendation" style="background: rgba(239, 68, 68, 0.05); border-left: 3px solid var(--danger);">
            <strong>🚨 STATUS DA ORGANIZAÇÃO: INAPTA PARA RECEBIMENTO DE EMENDAS</strong>
            Estatutos defasados ou sem a inclusão de termos específicos exigidos pelas portarias governamentais atualizadas resultam na <strong>rejeição sumária de propostas e convênios</strong> dentro da plataforma federal. É necessário redigir emendas de adequação e registrar ata corretiva para liberar a captação de recursos públicos.
        </div>
    </div>

    ${htmlOportunidades}

    <button class="btn btn-telegram" onclick="whats('${nome}')">
        🛠️ Solicitar Minuta de Adequação e Regularizar Entidade
    </button>
    `;

    document.getElementById("resultado").innerHTML = html;
}

function whats(nome){
    let editaisMsg = '';
    if (DADOS_EDITAIS) {
        const r = DADOS_EDITAIS.resumo_estrategico;
        editaisMsg = ` Vi que existem ${r.editais_abertos} editais abertos com ${r.soma_valores_humano} disponíveis e meu estatuto me impede de captar. Quero saber como sua empresa pode me orientar sobre quais editais são ideais para meu perfil e quanto submeter em cada projeto.`;
    }
    let msg = encodeURIComponent(`Olá! Me chamo ${nome}. Utilizei o Revisor de Estatuto PRO e o relatório apontou falhas de adequação no estatuto perante as portarias do TransfereGov (424/2016 e atualizações recentes).${editaisMsg} Preciso de suporte especializado e orçamento para emissão da ata e cláusulas corretivas.`);
    window.open(`https://t.me/coregovbr?text=${msg}`, "_blank");
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../supabase.js"></script>
<script src="../login.js"></script>

</body>
</html>
