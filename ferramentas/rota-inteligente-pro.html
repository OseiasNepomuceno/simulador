<script>

let dados = [];

/* ðŸ”¥ DETECTOR INTELIGENTE DE SEPARADOR */
function detectarSeparador(linha){
  if(linha.includes("\t")) return "\t";
  if(linha.includes(";")) return ";";
  return ",";
}

/* ðŸ”¥ CARREGAR BASE */
fetch("../base-empresas.csv")
.then(res => {
  if(!res.ok) throw new Error("Erro ao carregar base");
  return res.text();
})
.then(text => {

  const linhas = text.split("\n").filter(l => l.trim() !== "");
  const separador = detectarSeparador(linhas[0]);

  console.log("Separador detectado:", separador);

  const header = linhas[0].split(separador).map(h => h.toLowerCase().trim());

  dados = linhas.slice(1).map(l => {

    const col = l.split(separador);

    let endereco = (col[header.indexOf("endereco_completo")] || "").toUpperCase();

    if(!endereco) return null;

    let partes = endereco.split("-");
    let bairro = partes[partes.length - 1]?.trim() || "";

    /* PADRONIZAÃ‡ÃƒO */
    if(bairro.includes("ANA JACINTA")) bairro = "C. H. ANA JACINTA";
    if(bairro.includes("HUMBERTO SALVADOR")) bairro = "C. H. HUMBERTO SALVADOR";
    if(bairro.includes("BOSQUE")) bairro = "JARDIM DO BOSQUE";
    if(bairro.includes("BONGIO")) bairro = "JARDIM BONGIOVANI";
    if(bairro.includes("CENTRO")) bairro = "CENTRO";

    return {
      empresa: col[header.indexOf("razao_social")] || "",
      porte: col[header.indexOf("desc_porte")] || "",
      endereco: endereco,
      bairro: bairro,
      rua: endereco.split(",")[0]?.trim()
    };
  }).filter(Boolean);

  console.log("Empresas carregadas:", dados.length);

  popularBairros();
})
.catch(err => {
  console.error(err);
  document.getElementById("bairro").innerHTML = "<option>Erro ao carregar base</option>";
});

/* POPULAR BAIRROS */
function popularBairros(){
  const bairros = [...new Set(dados.map(d => d.bairro))].filter(b => b).sort();

  let select = document.getElementById("bairro");
  select.innerHTML = '<option value="">Selecione o bairro</option>';

  bairros.forEach(b => {
    let opt = document.createElement("option");
    opt.value = b;
    opt.textContent = b;
    select.appendChild(opt);
  });
}

/* GERAR ROTA */
function gerarRota(){

let bairro = document.getElementById("bairro").value;

if(!bairro){
  alert("Selecione um bairro");
  return;
}

let filtrado = dados.filter(d => d.bairro === bairro);

let ruas = {};

filtrado.forEach(d => {
  if(!ruas[d.rua]) ruas[d.rua] = [];
  ruas[d.rua].push(d);
});

let ranking = Object.entries(ruas)
.map(([rua, lista]) => {

  let me = lista.filter(e => e.porte.includes("ME")).length;
  let epp = lista.filter(e => e.porte.includes("EPP")).length;

  return {
    rua,
    total: lista.length,
    me,
    epp,
    score: (me * 2) + (epp * 1.5)
  };
})
.sort((a,b) => b.score - a.score);

let html = `<h3>ðŸ“Š Melhor rota em ${bairro}</h3>`;

ranking.slice(0,3).forEach(r => {

  html += `
  <div class="card">
    <strong>ðŸ“ ${r.rua}</strong> (${r.total} empresas)
    <br>
    ME: ${r.me} | EPP: ${r.epp}
    <span class="badge">Alta conversÃ£o</span>
  `;

  let lista = ruas[r.rua];

  lista.slice(0,2).forEach(emp => {

    let link = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(emp.endereco)}`;

    html += `
      <div class="item">
        ${emp.empresa} - ${emp.porte}
        <br>
        <a href="${link}" target="_blank">ðŸ—ºï¸ Ver no mapa</a>
      </div>
    `;
  });

  html += `</div>`;
});
