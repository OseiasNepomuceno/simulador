<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rota Inteligente PRO | COREGOV</title>

<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --verde:#00FF9F;
  --azul-escuro:#0B1220;
  --azul-medio:#111A2E;
  --branco:#fff;
  --cinza:#ccc;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  background:var(--azul-escuro);
  color:var(--branco);
  padding-top:90px;
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:15px 10%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(11,18,32,0.6);
  backdrop-filter:blur(10px);
  z-index:1000;
}

.logo-icon{height:50px;}

nav a{
  margin:0 10px;
  color:var(--cinza);
  text-decoration:none;
}

nav a:hover{color:var(--verde);}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

/* CARD */
.card{
  background:var(--azul-medio);
  padding:20px;
  border-radius:12px;
  margin-top:15px;
}

/* SELECT */
select{
  width:100%;
  padding:12px;
  border-radius:8px;
  margin:10px 0;
}

/* BOTÃO */
.btn{
  display:inline-block;
  background:var(--verde);
  color:#000;
  padding:10px 15px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-top:10px;
  cursor:pointer;
}

/* LISTA */
.item{
  border-bottom:1px solid rgba(255,255,255,0.1);
  padding:10px 0;
}

/* BADGE */
.badge{
  background:var(--verde);
  color:#000;
  padding:3px 8px;
  border-radius:6px;
  font-size:12px;
  margin-left:5px;
}

/* LOCK */
.lock{
  margin-top:20px;
  text-align:center;
  background:rgba(255,255,255,0.05);
  padding:20px;
  border-radius:12px;
}
</style>
</head>

<body>

<header>
  <img src="../logo-icon.png" class="logo-icon">

  <nav>
    <a href="../index.html">Início</a>
    <a href="../ferramentas.html" style="color:var(--verde)">Ferramentas</a>
  </nav>
</header>

<div class="container">

<h2>🚀 Rota Inteligente PRO</h2>
<p style="color:#ccc;">Descubra onde estão as melhores oportunidades para visitas comerciais</p>

<div class="card">

<select id="bairro">
  <option value="">Carregando bairros...</option>
</select>

<button class="btn" onclick="gerarRota()">Gerar rota inteligente</button>

<div id="resultado"></div>

</div>

</div>

<script>

let dados = [];

/* 🔥 CSV ROBUSTO (suporta vírgulas no texto) */
function parseCSV(text) {
  const linhas = [];
  let atual = '';
  let dentroAspas = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      dentroAspas = !dentroAspas;
    } else if (char === '\n' && !dentroAspas) {
      linhas.push(atual);
      atual = '';
    } else {
      atual += char;
    }
  }
  linhas.push(atual);

  return linhas.map(l => {
    const cols = [];
    let col = '';
    let aspas = false;

    for (let c of l) {
      if (c === '"') aspas = !aspas;
      else if (c === ',' && !aspas) {
        cols.push(col);
        col = '';
      } else col += c;
    }
    cols.push(col);
    return cols;
  });
}

/* CARREGAR CSV */
fetch("/base-empresas.csv")
.then(res => res.text())
.then(text => {

  const linhas = parseCSV(text);
  const header = linhas[0];

  dados = linhas.slice(1).map(col => {

    let endereco = (col[header.indexOf("endereco_completo")] || "").toUpperCase();
    let bairro = endereco.split("-").pop()?.trim() || "";

    /* PADRONIZAÇÃO */
    if(bairro.includes("ANA JACINTA")) bairro = "C. H. ANA JACINTA";
    if(bairro.includes("HUMBERTO SALVADOR")) bairro = "C. H. HUMBERTO SALVADOR";
    if(bairro.includes("BOSQUE")) bairro = "JARDIM DO BOSQUE";
    if(bairro.includes("BONGIO")) bairro = "JARDIM BONGIOVANI";
    if(bairro.includes("CENTRO")) bairro = "CENTRO";

    return {
      empresa: col[header.indexOf("razao_social")],
      porte: col[header.indexOf("desc_porte")],
      endereco: endereco,
      bairro: bairro,
      rua: endereco.split(",")[0]
    };
  });

  popularBairros();
});

/* POPULAR */
function popularBairros(){
  const bairros = [...new Set(dados.map(d => d.bairro))].filter(b => b).sort();

  let select = document.getElementById("bairro");
  select.innerHTML = '<option value="">Selecione o bairro</option>';

  bairros.forEach(b => {
    let opt = document.createElement("option");
    opt.value = b;
    opt.textContent = b;
    select.appendChild(opt);
  });
}

/* GERAR ROTA */
function gerarRota(){

let bairro = document.getElementById("bairro").value;

if(!bairro){
  alert("Selecione um bairro");
  return;
}

let filtrado = dados.filter(d => d.bairro === bairro);

/* AGRUPAR RUAS */
let ruas = {};

filtrado.forEach(d => {
  if(!ruas[d.rua]) ruas[d.rua] = [];
  ruas[d.rua].push(d);
});

/* SCORE */
let ranking = Object.entries(ruas)
.map(([rua, lista]) => {

  let me = lista.filter(e => e.porte?.includes("ME")).length;
  let epp = lista.filter(e => e.porte?.includes("EPP")).length;

  return {
    rua,
    total: lista.length,
    me,
    epp,
    score: (me * 2) + (epp * 1.5)
  };
})
.sort((a,b) => b.score - a.score);

/* EXIBIÇÃO */
let html = `<h3>📊 Melhor rota em ${bairro}</h3>`;

ranking.slice(0,3).forEach(r => {

  html += `
  <div class="card">
    <strong>📍 ${r.rua}</strong> (${r.total} empresas)
    <br>
    ME: ${r.me} | EPP: ${r.epp}
    <span class="badge">Alta conversão</span>
  `;

  let lista = ruas[r.rua];

  lista.slice(0,2).forEach(emp => {

    let link = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(emp.endereco)}`;

    html += `
      <div class="item">
        ${emp.empresa} - ${emp.porte}
        <br>
        <a href="${link}" target="_blank">🗺️ Ver no mapa</a>
      </div>
    `;
  });

  html += `</div>`;
});

/* PRO */
html += `
<div class="lock">
  <h3>🔒 Versão PRO</h3>

  <p style="color:#ccc;">
    Você está vendo apenas 20% do potencial deste bairro
  </p>

  <p>✔ Lista completa de empresas</p>
  <p>✔ Rota otimizada por conversão</p>
  <p>✔ Prioridade por tipo de cliente</p>
  <p>✔ Exportação de leads</p>

  <a href="https://wa.me/5518991511523?text=Quero acesso PRO da Rota Inteligente"
     class="btn" target="_blank">
     Liberar acesso PRO
  </a>
</div>
`;

document.getElementById("resultado").innerHTML = html;

}

</script>

</body>
</html>
